name: Deploy Python API to Lambda

on:
  push:
    branches:
      - main
    paths:
      - api/**
      - .github/workflows/deploy-api.yaml

jobs:

  # デプロイの実行
  deploy:
    runs-on: ubuntu-latest

    # 各APIに対して処理
    strategy:
      matrix:
        target:
          - EnglishStudyBotPushQuestion
          - EnglishStudyBotFeedback

    steps:
      # リポジトリをクローン
      - name: Checkout repository
        uses: actions/checkout@v3

      # Python環境をセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' 

      # 依存関係をインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t .
        working-directory: api/${{ matrix.target }}

      # AWS CLIの設定
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      # Lambda関数をアップデート
      - name: Deploy Lambda function
        run: |
          zip -r function.zip .
          aws lambda update-function-code --function-name ${{ matrix.target }} --zip-file fileb://function.zip
        working-directory: api/${{ matrix.target }}
